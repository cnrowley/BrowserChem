name: Deploy GitHub Pages

# Plain static-file deploy -- no build step, matches how this app is
# meant to be served (CLAUDE.md: "no build step, no bundler"). Uploads
# the repo as-is; does NOT run `git lfs pull`, so model/ocsrglyph/*.onnx
# (Git LFS) is served as its ~130-byte pointer stub on the hosted site,
# not the real model -- the Image -> Structure tab only works when run
# locally with LFS pulled (see README.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
